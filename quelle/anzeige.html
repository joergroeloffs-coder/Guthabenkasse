<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guthaben abfragen · Fering Vereinsmanager</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-anzeige.webmanifest">
<meta name="theme-color" content="#0C1D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--kopf:#0C1D14;--papier:#FAF8F1;--watt:#1E5C3E;--gold:#B08D3C;--ziegel:#93382B;--messing:#80621C;--tinte:#10251A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--kopf);color:var(--papier);font-family:'Inter','Liberation Sans',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#buehne{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
#kopf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:0 0 auto}
#titel{font-family:'Newsreader',Georgia,serif;font-size:clamp(20px,4.5vw,30px);margin:0}
#sprachen{display:flex;gap:6px}
#sprachen button{border:1px solid #3d5a49;background:transparent;color:var(--papier);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600;min-width:46px;cursor:pointer}
#sprachen button[aria-pressed=true]{background:var(--papier);color:var(--kopf)}
#mitte{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#kamera{position:relative;width:min(88vw,62vh);aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:#000;border:3px solid #2c4a39}
#video{width:100%;height:100%;object-fit:cover;display:block}
#rahmen{position:absolute;inset:14%;border:4px solid rgba(250,248,241,.85);border-radius:18px;pointer-events:none;animation:atmen 2.2s ease-in-out infinite}
@keyframes atmen{50%{inset:11%;border-color:rgba(176,141,60,.95)}}
#hinweis{flex:0 0 auto;text-align:center;font-size:clamp(20px,5.2vw,34px);line-height:1.25;padding:10px 6px 4px;min-height:2.6em}
#ergebnis{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;border-radius:22px;background:var(--papier);color:var(--tinte)}
#ergebnis.zeigt{display:flex}
#ergebnis .was{font-size:clamp(20px,5vw,32px);letter-spacing:.08em;text-transform:uppercase;color:#57685C}
#ergebnis .betrag{font-family:'Newsreader',Georgia,serif;font-size:clamp(64px,19vw,150px);line-height:1.05;color:var(--watt);margin:6px 0}
#ergebnis .karte{font-size:clamp(18px,4.2vw,26px);color:#57685C}
#ergebnis .rest{margin-top:16px;font-size:clamp(16px,3.8vw,24px);background:#F5EEDC;border-left:6px solid var(--gold);padding:10px 14px;border-radius:4px;max-width:92%}
#ergebnis.fehler{background:#F7E7E2;color:var(--ziegel)}
#ergebnis.fehler .betrag{color:var(--ziegel);font-size:clamp(34px,9vw,70px)}
#ergebnis.offen .betrag{color:var(--messing)}
#balken{position:absolute;left:0;bottom:0;height:8px;background:var(--gold);width:100%;transform-origin:left;display:none}
#ergebnis.zeigt #balken{display:block}
#fuss{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#7d9486;min-height:22px}
#kam,#voll{border:1px solid #3d5a49;background:transparent;color:#9fb3a6;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
#einricht{position:fixed;inset:0;background:rgba(5,12,8,.94);display:none;align-items:center;justify-content:center;z-index:5;padding:20px}
#einricht.zeigt{display:flex}
#einricht form{background:var(--papier);color:var(--tinte);border-radius:12px;padding:20px;width:min(94vw,440px);display:flex;flex-direction:column;gap:10px}
#einricht label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#57685C;display:flex;flex-direction:column;gap:4px}
#einricht input,#einricht select{font-size:16px;padding:10px;border:1px solid #CDB77E;border-radius:6px;background:#fff;color:var(--tinte)}
#einricht .reihe{display:flex;gap:8px;margin-top:6px}
#einricht button{flex:1;padding:12px;font-size:16px;border-radius:8px;border:1px solid var(--watt);background:var(--watt);color:#fff;cursor:pointer}
#einricht button.zu{background:transparent;color:var(--watt)}
#einrichtMeldung{font-size:13px;color:var(--ziegel);min-height:1.2em}
#kamerafehler{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;background:#111}
</style>
</head>
<body>
<div id="buehne">
  <div id="kopf"><h1 id="titel">Guthaben abfragen</h1>
    <div id="sprachen"><button data-s="de">DE</button><button data-s="tr">TR</button><button data-s="en">EN</button></div></div>
  <div id="mitte">
    <div id="kamera"><video id="video" playsinline muted></video><div id="rahmen"></div><div id="kamerafehler"></div>
      <div id="ergebnis"><div class="was" id="eWas"></div><div class="betrag" id="eBetrag"></div><div class="karte" id="eKarte"></div><div class="rest" id="eRest"></div><div id="balken"></div></div>
    </div>
  </div>
  <div id="hinweis"></div>
  <div id="fuss"><span id="stand"></span><span><button id="kam" type="button" title="Kamera wechseln">⟲ Kamera</button> <button id="voll" type="button">⛶</button></span></div>
</div>

<div id="einricht"><form id="einrichtForm" autocomplete="off">
  <b style="font-size:18px">Einrichtung des Anzeigegeräts</b>
  <label>Adresse der Ablage<input id="eAdresse" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false"></label>
  <label>Zugangswort (Anzeige)<input id="eWort" spellcheck="false"></label>
  <label>Standardsprache<select id="eSprache"><option value="de">Deutsch</option><option value="tr">Türkçe</option><option value="en">English</option></select></label>
  <label>Kamera<select id="eKamera"><option value="environment">hinten</option><option value="user">vorn (Selfie-Kamera)</option></select></label>
  <label>Hinweis zur Rückgabe (freiwillig)<input id="eRueck" maxlength="120" placeholder="z. B. Rückgabe an der Kasse am Tresen"></label>
  <div id="einrichtMeldung"></div>
  <div class="reihe"><button type="button" class="zu" id="eZu">Schließen</button><button type="submit">Speichern</button></div>
  <div style="font-size:12px;color:#57685C">Dieses Fenster öffnet man mit fünf schnellen Tipps auf die Überschrift.</div>
</form></div>
<canvas id="lesefeld" style="display:none"></canvas>

<script>
/*JSQR*/
</script>
<script>
"use strict";
var KEY = "guthabenkasse.anzeige.v1";
var VERSION = "2.0.0";
var cfg = {adresse: "", wort: "", sprache: "de", rueck: "", kamera: "environment"};
try { var gespeichert = JSON.parse(localStorage.getItem(KEY) || "{}"); for (var k in gespeichert) cfg[k] = gespeichert[k]; } catch (e) {}
function sichern() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }
function $(id) { return document.getElementById(id); }

var TEXT = {
  de: { titel: "Guthaben abfragen", halten: "Halten Sie Ihre Karte vor die Kamera", ihr: "Ihr Guthaben", karte: "Karte", offen: "Noch zu zahlen",
        rueck: "Nicht ausgegebenes Guthaben bekommen Sie am Ende des Abends zurück.", unbekannt: "Karte nicht erkannt", unbekanntT: "Bitte fragen Sie an der Kasse.",
        gesperrt: "Karte gesperrt", gesperrtT: "Bitte melden Sie sich an der Kasse.", keineKarte: "Das ist keine Guthabenkarte", netz: "Keine Verbindung", netzT: "Bitte fragen Sie an der Kasse.",
        zuviele: "Einen Moment bitte", einricht: "Noch nicht eingerichtet", kamera: "Die Kamera ist nicht freigegeben. Bitte die Seite über https öffnen und die Kamera erlauben.", sprache: "Sprache" },
  tr: { titel: "Bakiye sorgulama", halten: "Kartınızı kameraya tutun", ihr: "Bakiyeniz", karte: "Kart", offen: "Ödenecek tutar",
        rueck: "Harcamadığınız para akşamın sonunda iade edilir.", unbekannt: "Kart tanınmadı", unbekanntT: "Lütfen kasaya sorun.",
        gesperrt: "Kart engelli", gesperrtT: "Lütfen kasaya başvurun.", keineKarte: "Bu bir bakiye kartı değil", netz: "Bağlantı yok", netzT: "Lütfen kasaya sorun.",
        zuviele: "Lütfen bir an bekleyin", einricht: "Henüz kurulmadı", kamera: "Kamera izni verilmedi. Lütfen sayfayı https ile açın ve kameraya izin verin.", sprache: "Dil" },
  en: { titel: "Check your balance", halten: "Hold your card in front of the camera", ihr: "Your balance", karte: "Card", offen: "Still to pay",
        rueck: "Any balance you don't spend is refunded at the end of the evening.", unbekannt: "Card not recognised", unbekanntT: "Please ask at the till.",
        gesperrt: "Card blocked", gesperrtT: "Please see the staff at the till.", keineKarte: "This is not a balance card", netz: "No connection", netzT: "Please ask at the till.",
        zuviele: "One moment please", einricht: "Not set up yet", kamera: "Camera access is blocked. Please open the page via https and allow the camera.", sprache: "Language" }
};
var sprache = cfg.sprache || "de";
function t(k) { return (TEXT[sprache] && TEXT[sprache][k]) || TEXT.de[k]; }
function euro(c) { return (Math.abs(c) / 100).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €"; }

var zeigtBis = 0, ruheTimer = null, sprachTimer = null, letzter = {text: "", zeit: 0}, laeuft = false;
function sprachSetzen(s, ausTipp) {
  sprache = s; document.documentElement.lang = s;
  Array.prototype.forEach.call(document.querySelectorAll("#sprachen button"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-s") === s ? "true" : "false"); });
  $("titel").textContent = t("titel");
  if (!$("ergebnis").classList.contains("zeigt")) $("hinweis").textContent = bereit() ? t("halten") : t("einricht");
  clearTimeout(sprachTimer);
  if (ausTipp && s !== (cfg.sprache || "de")) sprachTimer = setTimeout(function () { sprachSetzen(cfg.sprache || "de"); }, 45000);
}
function bereit() { return !!(cfg.adresse && cfg.wort); }

function zuruecksetzen() {
  $("ergebnis").className = ""; zeigtBis = 0;
  $("hinweis").textContent = bereit() ? t("halten") : t("einricht");
  sprachSetzen(cfg.sprache || "de");
}
function zeigen(klasse, was, betrag, karte, rest) {
  var e = $("ergebnis");
  e.className = "zeigt " + klasse;
  $("eWas").textContent = was; $("eBetrag").textContent = betrag; $("eKarte").textContent = karte || "";
  $("eRest").textContent = rest || ""; $("eRest").style.display = rest ? "" : "none";
  $("hinweis").textContent = "";
  var b = $("balken"); b.style.transition = "none"; b.style.transform = "scaleX(1)"; void b.offsetWidth;
  var dauer = klasse === "fehler" ? 6000 : 9000;
  b.style.transition = "transform " + dauer + "ms linear"; b.style.transform = "scaleX(0)";
  zeigtBis = Date.now() + dauer; clearTimeout(ruheTimer); ruheTimer = setTimeout(zuruecksetzen, dauer);
  if (navigator.vibrate) navigator.vibrate(klasse === "fehler" ? [60, 40, 60] : 40);
}

function abfragen(roh) {
  if (laeuft) return;
  var text = String(roh || "").trim();
  var norm = text.toUpperCase();
  if (!/^(?:GK-?)?[A-Z]\d{4,6}(?:-[A-Z0-9]{4})?$/.test(norm.replace(/\s+/g, ""))) {
    if (Date.now() - letzter.zeit < 2500 && letzter.text === norm) return;
    letzter = {text: norm, zeit: Date.now()};
    zeigen("fehler", t("keineKarte"), "?", "", ""); return;
  }
  /* dieselbe Karte, solange ihr Ergebnis noch steht: nichts neu abfragen */
  if (letzter.text === norm && Date.now() < zeigtBis) return;
  if (!bereit()) { zeigen("fehler", t("einricht"), "?", "", ""); return; }
  letzter = {text: norm, zeit: Date.now()};
  laeuft = true;
  var ende = false, frist = setTimeout(function () { if (!ende) { ende = true; laeuft = false; zeigen("fehler", t("netz"), "!", "", t("netzT")); } }, 10000);
  fetch(cfg.adresse, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, redirect: "follow",
                      body: JSON.stringify({aktion: "bestand", wort: cfg.wort, karte: norm})})
    .then(function (a) { return a.text(); })
    .then(function (x) {
      if (ende) return; ende = true; clearTimeout(frist); laeuft = false;
      var a = null; try { a = JSON.parse(x); } catch (e) {}
      if (!a) { zeigen("fehler", t("netz"), "!", "", t("netzT")); return; }
      if (a.zuviele) { zeigen("fehler", t("zuviele"), "…", "", ""); return; }
      if (a.fehler) { zeigen("fehler", t("netz"), "!", "", t("netzT")); return; }
      if (a.st === "ok") zeigen("ok", t("ihr"), euro(a.cent), t("karte") + " " + a.karte, cfg.rueck || t("rueck"));
      else if (a.st === "offen") zeigen("offen", t("offen"), euro(a.cent), t("karte") + " " + a.karte, "");
      else if (a.st === "gesperrt") zeigen("fehler", t("gesperrt"), "✕", "", t("gesperrtT"));
      else zeigen("fehler", t("unbekannt"), "?", "", t("unbekanntT"));
    })
    .catch(function () { if (ende) return; ende = true; clearTimeout(frist); laeuft = false; zeigen("fehler", t("netz"), "!", "", t("netzT")); });
}

/* ---- Kamera ---- */
var strom = null, leser = null;
function kameraStart() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { kameraFehler(); return; }
  navigator.mediaDevices.getUserMedia({video: {facingMode: cfg.kamera || "environment"}}).then(function (s) { kameraMit(s); }, function () {
    return navigator.mediaDevices.getUserMedia({video: true}).then(kameraMit);
  }).catch(kameraFehler);
}
function kameraMit(s) {
  strom = s; var v = $("video"); v.srcObject = s; v.muted = true;
  var l = v.play(); if (l && l.catch) l.catch(function () {});
  leser = ("BarcodeDetector" in window) ? new window.BarcodeDetector({formats: ["qr_code"]}) : null;
  $("kamerafehler").style.display = "none"; takt();
}
function kameraFehler() { var f = $("kamerafehler"); f.textContent = t("kamera"); f.style.display = "flex"; }
function takt() {
  function weiter() { setTimeout(takt, 200); }
  var v = $("video");
  if (!strom || !v.videoWidth) { weiter(); return; }
  if (leser) { leser.detect(v).then(function (c) { if (c.length) abfragen(c[0].rawValue); }).catch(function () {}).then(weiter); return; }
  try {
    var breit = Math.min(480, v.videoWidth), hoch = Math.round(v.videoHeight * breit / v.videoWidth), f = $("lesefeld");
    if (f.width !== breit) { f.width = breit; f.height = hoch; }
    var st = f.getContext("2d", {willReadFrequently: true}); st.drawImage(v, 0, 0, breit, hoch);
    var b = st.getImageData(0, 0, breit, hoch), fund = window.jsQR && window.jsQR(b.data, b.width, b.height, {inversionAttempts: "dontInvert"});
    if (fund && fund.data) abfragen(fund.data);
  } catch (e) {}
  weiter();
}

/* ---- Einrichtung: fünf schnelle Tipps auf die Überschrift ---- */
var tipps = [];
$("titel").addEventListener("click", function () {
  var jetzt = Date.now(); tipps = tipps.filter(function (z) { return jetzt - z < 3000; }); tipps.push(jetzt);
  if (tipps.length >= 5) { tipps = []; einrichtungOeffnen(); }
});
function einrichtungOeffnen() {
  $("eAdresse").value = cfg.adresse || ""; $("eWort").value = cfg.wort || ""; $("eSprache").value = cfg.sprache || "de"; $("eRueck").value = cfg.rueck || ""; $("eKamera").value = cfg.kamera || "environment";
  $("einrichtMeldung").textContent = ""; $("einricht").classList.add("zeigt");
}
$("eZu").addEventListener("click", function () { $("einricht").classList.remove("zeigt"); });
$("einrichtForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var a = $("eAdresse").value.trim(), w = $("eWort").value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(a)) { $("einrichtMeldung").textContent = "Die Adresse muss mit https://script.google.com/ beginnen und auf /exec enden."; return; }
  if (!w) { $("einrichtMeldung").textContent = "Das Zugangswort fehlt."; return; }
  cfg.adresse = a; cfg.wort = w; cfg.sprache = $("eSprache").value; cfg.rueck = $("eRueck").value.trim(); var neueKamera = $("eKamera").value; var kameraGewechselt = neueKamera !== (cfg.kamera || "environment"); cfg.kamera = neueKamera; sichern();
  if (kameraGewechselt) { try { if (strom) strom.getTracks().forEach(function (x) { x.stop(); }); } catch (f) {} strom = null; kameraStart(); }
  $("einrichtMeldung").textContent = "…prüft";
  fetch(a, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, redirect: "follow", body: JSON.stringify({aktion: "bestand", wort: w, karte: "GK-X0000"})})
    .then(function (r) { return r.text(); }).then(function (x) {
      var j = null; try { j = JSON.parse(x); } catch (f) {}
      if (j && j.ok) { $("einricht").classList.remove("zeigt"); zuruecksetzen(); }
      else $("einrichtMeldung").textContent = (j && j.fehler) ? "Die Ablage lehnt ab: " + j.fehler : "Keine gültige Antwort der Ablage.";
    }).catch(function () { $("einrichtMeldung").textContent = "Die Ablage ist nicht erreichbar."; });
});

/* ---- Verdrahtung ---- */
Array.prototype.forEach.call(document.querySelectorAll("#sprachen button"), function (b) {
  b.addEventListener("click", function () { sprachSetzen(b.getAttribute("data-s"), true); if (!$("ergebnis").classList.contains("zeigt")) $("hinweis").textContent = bereit() ? t("halten") : t("einricht"); });
});
$("kam").addEventListener("click", function () {
  cfg.kamera = (cfg.kamera || "environment") === "user" ? "environment" : "user"; sichern();
  try { if (strom) strom.getTracks().forEach(function (x) { x.stop(); }); } catch (e) {} strom = null; kameraStart();
});
$("voll").addEventListener("click", function () {
  var el = document.documentElement;
  try { if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); } catch (e) {}
});
var wach = null;
function wachhalten() { try { if (navigator.wakeLock && !document.hidden) navigator.wakeLock.request("screen").then(function (w) { wach = w; }, function () {}); } catch (e) {} }
document.addEventListener("visibilitychange", wachhalten);
$("stand").textContent = "v" + VERSION;
sprachSetzen(sprache); zuruecksetzen(); kameraStart(); wachhalten();
try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").then(null, function () {}); } catch (e) {}
</script>
</body>
</html>
